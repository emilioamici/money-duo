# Copia questo file in worker/wrangler.toml (ignorato da Git) e inserisci l'ID del tuo spazio KV.
name = "moneyduo-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Origine del sito (solo schema + dominio, senza /money-duo). Più origini separate da virgola.
ALLOWED_ORIGINS = "https://<utente>.github.io,http://localhost:5173"
# Contatto inviato ai servizi di push: l'indirizzo del sito va benissimo
VAPID_SUBJECT = "https://<utente>.github.io/money-duo/"

[[kv_namespaces]]
binding = "SUBS"
id = "INSERISCI_QUI_L_ID_DEL_KV"
