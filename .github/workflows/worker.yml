name: Deploy Worker (Cloudflare)

# Pubblica il Worker (cartella worker/) a ogni modifica su main, così non serve più `npx wrangler deploy` dal computer.
# Non parte finché non è configurato: vedi «Pubblicazione automatica» in worker/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # senza l'ID dell'archivio KV il job viene saltato (non fallisce)
    if: ${{ vars.CF_KV_NAMESPACE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configurazione del Worker
        # `keep_vars`: i valori già impostati su Cloudflare (ALLOWED_ORIGINS, GOOGLE_CLIENT_ID, …) restano com'erano;
        # i segreti (chiavi VAPID, client secret, SESSION_KEY) non vengono mai toccati dal deploy.
        run: |
          cat > worker/wrangler.toml <<TOML
          name = "${{ vars.CF_WORKER_NAME || 'moneyduo-push' }}"
          main = "src/index.ts"
          compatibility_date = "2025-01-01"
          keep_vars = true

          [[kv_namespaces]]
          binding = "SUBS"
          id = "${{ vars.CF_KV_NAMESPACE_ID }}"
          TOML
      - name: Pubblicazione
        working-directory: worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Controllo
        if: ${{ vars.VITE_PUSH_URL != '' }}
        run: curl -fsS "${{ vars.VITE_PUSH_URL }}/health" && echo
